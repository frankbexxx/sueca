# Local Postgres for AUTH-01B (Account / ExternalIdentity / refresh_tokens).
# Does not replace multiplayer in-memory guest auth.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: suecao
      POSTGRES_PASSWORD: suecao
      POSTGRES_DB: suecao_auth
    volumes:
      - suecao_auth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suecao -d suecao_auth']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  suecao_auth_pg:
