# CI for the CRA frontend (root: frontend/). Runs on PRs and pushes to main / v2-main.
name: CI

on:
  push:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        env:
          CI: true
        run: npm run build
