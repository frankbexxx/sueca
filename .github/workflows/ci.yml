# CI for the Vite frontend (root: frontend/). Runs on PRs and pushes to main / v2-main.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate buildInfo
        run: node scripts/write-build-info.mjs

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test
        env:
          CI: true
        run: npm test

      - name: Build
        env:
          CI: true
          VITE_USE_LOCAL_AI_ONLY: "true"
          VITE_CARD_EXT: png
        run: npm run build

      - name: Verify card assets
        run: |
          set -euo pipefail
          dir=public/assets/cards3
          test -d "$dir"

          # Casino faces: Rank_of_Suit.png (exactly 52; backs use card_back*.png and must not count)
          ranks=(2 3 4 5 6 7 8 9 10 Jack Queen King Ace)
          suits=(Clubs Diamonds Hearts Spades)
          missing=0
          for r in "${ranks[@]}"; do
            for s in "${suits[@]}"; do
              f="$dir/${r}_of_${s}.png"
              if [[ ! -f "$f" ]]; then
                echo "MISSING face: $f"
                missing=$((missing + 1))
              fi
            done
          done
          test "$missing" -eq 0

          faces=$(find "$dir" -maxdepth 1 -type f -name '*_of_*.png' | wc -l)
          test "$faces" -eq 52

          for back in \
            card_back.png \
            card_back_casino_05.png \
            card_back_casino_06.png \
            card_back_casino_07.png \
            card_back_casino_08.png \
            card_back_red.png
          do
            test -f "$dir/$back" || { echo "MISSING back: $dir/$back"; exit 1; }
          done

          echo "Verify card assets: PASS (faces=$faces backs=6)"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check src/server.js
