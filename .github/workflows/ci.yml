# CI for the CRA frontend (root: frontend/). Runs on PRs and pushes to main / v2-main.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        env:
          CI: true
          REACT_APP_USE_LOCAL_AI_ONLY: "true"
          REACT_APP_CARD_EXT: png
        run: npm run build

      - name: Verify card assets
        run: |
          png=$(ls -1 public/assets/cards2/*_of_*.png 2>/dev/null | wc -l)
          svg=$(ls -1 public/assets/cards2/*_of_*.svg 2>/dev/null | wc -l)
          total=$((png + svg))
          test "$total" -ge 52

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check src/server.js
