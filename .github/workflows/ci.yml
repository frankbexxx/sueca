# CI for the Vite frontend (root: frontend/). Runs on PRs and pushes to main / v2-main.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2-main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate buildInfo
        run: node scripts/write-build-info.mjs

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test
        env:
          CI: true
        run: npm test

      - name: Build
        env:
          CI: true
          VITE_USE_LOCAL_AI_ONLY: "true"
          VITE_CARD_EXT: png
        run: npm run build

      - name: Verify card assets
        run: |
          set -euo pipefail
          ranks=(2 3 4 5 6 7 8 9 10 Jack Queen King Ace)
          suits=(Clubs Diamonds Hearts Spades)

          verify_faces() {
            local dir="$1"
            test -d "$dir"
            local missing=0
            for r in "${ranks[@]}"; do
              for s in "${suits[@]}"; do
                f="$dir/${r}_of_${s}.png"
                if [[ ! -f "$f" ]]; then
                  echo "MISSING face: $f"
                  missing=$((missing + 1))
                fi
              done
            done
            test "$missing" -eq 0
            local faces
            faces=$(find "$dir" -maxdepth 1 -type f -name '*_of_*.png' | wc -l)
            test "$faces" -eq 52
            echo "faces ok: $dir ($faces)"
          }

          verify_faces public/assets/cards-cardmeister
          verify_faces public/assets/cards/pd-ornate

          for back in \
            suecao-navy.png \
            sylly-01.png \
            sylly-02.png \
            sylly-03.png \
            sylly-04.png \
            sylly-05.png \
            sylly-06.png
          do
            test -f "public/assets/card-backs/$back" || {
              echo "MISSING back: public/assets/card-backs/$back"
              exit 1
            }
          done

          test ! -d public/assets/cards3 || {
            echo "FAIL: legacy Casino cards3 must not ship"
            exit 1
          }

          echo "Verify card assets: PASS (cardmeister + pd-ornate + 7 backs)"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check src/server.js
